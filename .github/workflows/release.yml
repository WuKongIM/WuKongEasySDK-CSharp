name: Release NuGet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to nuget.org (main only)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version and notes
        id: metadata
        run: python scripts/release.py metadata
      - run: python -m unittest discover -s scripts -p 'test_release.py'
      - run: dotnet build -c Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test -c Release --no-build
      - name: Pack the tested source revision
        shell: bash
        run: dotnet pack src/WuKongEasySDK -c Release --no-build -p:RepositoryCommit="$GITHUB_SHA" -o artifacts
      - name: Verify isolated package installation
        shell: bash
        run: python scripts/release.py local --commit "$GITHUB_SHA"
      - name: Preserve the tested Linux package for publication
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-release
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release commit reachable from main and a NuGet identity
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -n "$NUGET_USER" || { echo 'Configure NUGET_USER and the NuGet trusted publishing policy.'; exit 1; }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-release
          path: artifacts
      - name: Exchange GitHub OIDC identity for a temporary NuGet key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the tested package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: dotnet nuget push "artifacts/WuKongEasySDK.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Verify public package contents and clean consumer installation
        run: python scripts/release.py public --commit "$GITHUB_SHA"

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-release
          path: artifacts
      - name: Publish release notes only after NuGet installation succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "artifacts/WuKongEasySDK.$VERSION.nupkg" --target "$GITHUB_SHA" --title "WuKongEasySDK $VERSION" --notes-file artifacts/release-notes.md
          fi
