name: CSharp and JS interoperability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [released, candidate]
        transport: [ws, browser-wss, cluster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the reviewed server pin
        id: pins
        env:
          TRANSPORT: ${{ matrix.transport }}
        run: |
          python3 - <<'PY'
          import json, os, re
          pins = json.load(open('tests/interop/pins.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              key = 'clusterServerCommit' if os.environ['TRANSPORT'] == 'cluster' else 'serverCommit'
              pin = pins[key]
              assert re.fullmatch('[0-9a-f]{40}', pin)
              output.write(f'server={pin}\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WuKongIM/WuKongIM
          ref: ${{ steps.pins.outputs.server }}
          path: .server
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .server/go.mod
          cache-dependency-path: .server/go.sum
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.3.0'
      - name: Install Chromium and isolated trust-store tooling
        if: matrix.transport == 'browser-wss'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          npm ci --prefix tests/interop/js --ignore-scripts --no-audit --no-fund
          tests/interop/js/node_modules/.bin/playwright install --with-deps chromium
      - name: Build the exact real server
        working-directory: .server
        run: GOWORK=off go build -o "$RUNNER_TEMP/wukongim-interop" ./cmd/wukongim
      - name: Run real-process interoperability
        env:
          WUKONGIM_BINARY: ${{ runner.temp }}/wukongim-interop
          MODE: ${{ matrix.mode }}
          TRANSPORT: ${{ matrix.transport }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          args=()
          if [ "$MODE" = candidate ]; then args+=(--candidate); fi
          if [ "$TRANSPORT" = browser-wss ]; then
            python3 scripts/interop.py "${args[@]}" --transport native
            python3 scripts/interop.py "${args[@]}" --transport browser-wss
          elif [ "$TRANSPORT" = cluster ]; then
            python3 scripts/interop.py "${args[@]}" --transport native --topology three-node
          else
            python3 scripts/interop.py "${args[@]}"
          fi
      - name: Preserve the bounded result (no raw server or client logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interop-${{ matrix.mode }}-${{ matrix.transport }}
          path: artifacts/interop-${{ matrix.mode }}*.json
          if-no-files-found: warn
