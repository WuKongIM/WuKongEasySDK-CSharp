name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: python -m unittest discover -s scripts -p 'test_release.py'
      - run: python -m unittest discover -s scripts -p 'test_interop.py'
      - run: python -m unittest discover -s scripts -p 'test_cluster.py'
      - run: dotnet pack src/WuKongEasySDK -c Release --no-build -o artifacts
